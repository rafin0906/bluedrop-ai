services:
  - type: web
    name: bluedrop-ai-broker
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn broker:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: OPENAI_API_KEY
        sync: false
      - key: BRIDGE_TOKEN
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-sol
      - key: DATABASE_PATH
        value: ./data/jobs.sqlite3
